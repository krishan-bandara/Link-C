<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Offline</title>
<style>
  :root { --bg:#f4f5f7; --panel:#fff; --text:#16181d; --muted:#6a7080; --line:#e1e4ea; --accent:#3b6df0; --out:#dbe6ff; --in:#fff; --danger:#c62828; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1015; --panel:#171a21; --text:#eceef3; --muted:#8c93a3; --line:#262a33; --accent:#7ba0ff; --out:#26407f; --in:#1d212a; --danger:#ff8a80; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { display: flex; flex-direction: column; height: 100%; max-width: 720px; margin: 0 auto; background: var(--panel); }
  .notice { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); font-size: 13px; text-align: center; padding: 8px 14px; padding-top: calc(8px + env(safe-area-inset-top)); }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 18px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header a, button { color: var(--accent); background: none; border: 0; font: inherit; cursor: pointer; text-decoration: none; padding: 6px 8px; border-radius: 8px; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); }
  main { flex: 1; overflow-y: auto; }
  .row { display: flex; flex-direction: column; gap: 2px; padding: 12px 16px; border-bottom: 1px solid var(--line); color: inherit; text-decoration: none; }
  .row b { font-weight: 600; }
  .row span { color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { padding: 40px 24px; text-align: center; color: var(--muted); }
  .empty h2 { color: var(--text); font-size: 18px; }
  .msgs { display: flex; flex-direction: column; padding: 10px 12px 24px; gap: 4px; }
  .day { align-self: center; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  .sys { align-self: center; font-size: 12px; color: var(--muted); }
  .b { max-width: 82%; padding: 7px 11px; border-radius: 16px; background: var(--in); border: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; }
  .b.me { align-self: flex-end; background: var(--out); border-color: transparent; }
  .b small { display: block; text-align: right; color: var(--muted); font-size: 11px; margin-top: 2px; }
  .b.na { font-style: italic; color: var(--muted); }
  .b.pend { opacity: .75; }
  .b.fail { border-color: var(--danger); }
  .foot { padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div id="app"><p class="notice">You are offline.</p><div class="empty"><p>Loading...</p></div></div>
<noscript><p style="padding:24px">You are offline. Turn on JavaScript or reconnect to use Link-C.</p></noscript>
<script src="/offline.js"></script>
</body>
</html>
